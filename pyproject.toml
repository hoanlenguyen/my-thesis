[project]
name = "hems"
version = "0.1.0"
description = "Hierarchical ReAct multi-agent pipeline for residential appliance scheduling (Master's thesis artifact)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "langgraph>=1.0",
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langchain-openai>=1.0",
  "langchain-groq>=1.0",
  "pydantic>=2.7",
  "pulp[cbc]>=3.3",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "matplotlib>=3.8",
  "python-dotenv>=1.0",
  "entsoe-py>=0.6",
  "langchain-ollama>=1.0",
]

[project.optional-dependencies]
# Local API for the demo's "Try it" view (src/hems/demo_api.py); not needed for the evaluation.
demo = ["fastapi>=0.115", "uvicorn>=0.30"]
# LangGraph Studio for the pipeline (langgraph.json -> src/hems/studio.py); not needed for the evaluation.
studio = ["langgraph-cli[inmem]>=0.4"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
hems = "hems.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hems"]

[tool.pytest.ini_options]
testpaths = ["tests"]
