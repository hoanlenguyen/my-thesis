# Builds the demo API image (Dockerfile) and pushes it to GitHub Container Registry:
# ghcr.io/<owner>/hems-demo-api:latest. Run it by hand (Actions > Demo API image > Run workflow) or on a push to
# main that changes the API. Azure Container Apps pulls the image from there (deploy/README.md).
name: Demo API image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - pyproject.toml
      - uv.lock
      - src/**
      - tools/emhass_rest.py
      - data/scenarios_v2/**
      - data/rag/**

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      # Only the files the image needs (the repository also holds about 1 GB of raw RAPT data)
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Dockerfile
            /.dockerignore
            /pyproject.toml
            /uv.lock
            /src/
            /tools/emhass_rest.py
            /data/scenarios_v2/
            /data/rag/
            /results/demo_cache/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hems-demo-api:latest
            ghcr.io/${{ github.repository_owner }}/hems-demo-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
