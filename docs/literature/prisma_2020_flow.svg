<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 55 892 600" width="892" height="600" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="910" height="700" fill="#fff"/>

  <!-- stage labels -->
  <text x="20" y="84" font-weight="bold" fill="#555">IDENTIFICATION</text>
  <text x="20" y="188" font-weight="bold" fill="#555">SCREENING</text>
  <text x="20" y="582" font-weight="bold" fill="#555">INCLUDED</text>

  <!-- identification -->
  <rect x="140" y="62" width="400" height="74" fill="#eef3fa" stroke="#456"/>
  <text x="150" y="82" font-weight="bold">Records identified from databases (n = 608)</text>
  <text x="150" y="102">Scopus, Advanced search: n = 358</text>
  <text x="150" y="120">IEEE Xplore, Command Search: n = 250</text>

  <rect x="600" y="62" width="280" height="74" fill="#eef3fa" stroke="#456"/>
  <text x="610" y="82" font-weight="bold">Records identified from other</text>
  <text x="610" y="98" font-weight="bold">methods (n = 2)</text>
  <text x="610" y="120">Studies known to the author</text>

  <!-- title screening -->
  <rect x="140" y="166" width="400" height="58" fill="#fff" stroke="#456"/>
  <text x="150" y="188" font-weight="bold">Records screened on title (n = 608)</text>
  <text x="150" y="208">All records identified from databases</text>
  <line x1="340" y1="136" x2="340" y2="166" stroke="#333" marker-end="url(#a)"/>

  <rect x="600" y="166" width="280" height="58" fill="#fff" stroke="#456"/>
  <text x="610" y="188" font-weight="bold">Records excluded (n = 540)</text>
  <text x="610" y="208">Not LLM-based and/or not energy</text>
  <line x1="540" y1="195" x2="600" y2="195" stroke="#333" marker-end="url(#a)"/>

  <!-- retained, duplicates -->
  <rect x="140" y="254" width="400" height="58" fill="#fff" stroke="#456"/>
  <text x="150" y="276" font-weight="bold">Records retained after title screening (n = 68)</text>
  <text x="150" y="296">Scopus: n = 45; IEEE Xplore: n = 23</text>
  <line x1="340" y1="224" x2="340" y2="254" stroke="#333" marker-end="url(#a)"/>

  <rect x="600" y="254" width="280" height="58" fill="#fff" stroke="#456"/>
  <text x="610" y="276" font-weight="bold">Duplicate records removed (n = 14)</text>
  <text x="610" y="296">In both Scopus and IEEE Xplore</text>
  <line x1="540" y1="283" x2="600" y2="283" stroke="#333" marker-end="url(#a)"/>

  <!-- sought -->
  <rect x="140" y="342" width="400" height="76" fill="#fff" stroke="#456"/>
  <text x="150" y="364" font-weight="bold">Reports sought for retrieval (n = 54)</text>
  <text x="150" y="384">Full text retrieved: n = 7</text>
  <text x="150" y="402">Full text not retrieved: n = 47 (abstract used)</text>
  <line x1="340" y1="312" x2="340" y2="342" stroke="#333" marker-end="url(#a)"/>

  <!-- assessed -->
  <rect x="140" y="448" width="400" height="76" fill="#fff" stroke="#456"/>
  <text x="150" y="470" font-weight="bold">Reports assessed for eligibility (n = 56)</text>
  <text x="150" y="490">Full text: n = 9 (7 from databases, 2 from other methods)</text>
  <text x="150" y="508">Abstract only: n = 47 (deviation from PRISMA 2020)</text>
  <line x1="340" y1="418" x2="340" y2="448" stroke="#333" marker-end="url(#a)"/>
  <polyline points="880,99 893,99 893,476 540,476" fill="none" stroke="#333" marker-end="url(#a)"/>

  <rect x="600" y="496" width="280" height="96" fill="#fff" stroke="#456"/>
  <text x="610" y="518" font-weight="bold">Reports excluded (n = 7)</text>
  <text x="610" y="538">Not LLM-based (n = 4)</text>
  <text x="610" y="556">Not about energy (n = 2)</text>
  <text x="610" y="574">Second version of a cited study (n = 1)</text>
  <line x1="540" y1="500" x2="570" y2="500" stroke="#333"/>
  <line x1="570" y1="500" x2="570" y2="530" stroke="#333"/>
  <line x1="570" y1="530" x2="600" y2="530" stroke="#333" marker-end="url(#a)"/>

  <!-- included -->
  <rect x="140" y="560" width="400" height="74" fill="#e8f4ea" stroke="#375"/>
  <text x="150" y="582" font-weight="bold">Studies judged eligible (n = 49), see Appendix A</text>
  <text x="150" y="602">Discussed in Chapter 2: n = 25 (8 full text, 17 abstract only)</text>
  <text x="150" y="620">Not discussed: n = 24 (abstract only)</text>
  <line x1="340" y1="524" x2="340" y2="560" stroke="#333" marker-end="url(#a)"/>
</svg>
