<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Figure 4.2 single agent</title>
<style>
  :root {
    color-scheme: light;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --accent: #4338ca;
    --warn: #b45309;
  }
  html, body { margin: 0; padding: 0; background: #ffffff; color: var(--fg); font: 14px/1.4 Arial, Helvetica, sans-serif; }
  @page { size: 960px 650px; margin: 0; }
  svg { width: 960px; height: 650px; display: block; }
  .label { font-size: 15px; font-weight: 700; fill: var(--fg); }
  .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; fill: var(--accent); }
  .tag.h { fill: var(--muted); }
  .small { font-size: 12.5px; fill: var(--muted); }
  .mono { font-family: Consolas, "Courier New", monospace; font-size: 12px; fill: var(--fg); }
  .node { stroke: var(--line); stroke-width: 1.2; }
  .agent { fill: var(--process); stroke: var(--accent); stroke-width: 1.6; }
  .harness { fill: var(--neutral); stroke-dasharray: 5 4; }
  .input { fill: var(--input); }
  .storage { fill: var(--storage); }
  .external { fill: var(--external); }
  .edge { stroke: var(--line); stroke-width: 1.8; fill: none; }
  .edge.fb { stroke: var(--warn); stroke-dasharray: 6 4; }
  .bracket { stroke: var(--accent); stroke-width: 1.6; fill: none; }
  .arrow { fill: var(--line); }
  .arrow.fb { fill: var(--warn); }
  .fbtext { font-size: 12.5px; font-weight: 700; fill: var(--warn); }
  .conv { font-size: 12.5px; fill: var(--accent); }
  .conv.b { font-weight: 700; }
</style>
<svg viewBox="0 0 960 650" role="img" aria-label="The single agent in the same harness">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="arrow" />
    </marker>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="arrow fb" />
    </marker>
  </defs>

  <!-- legend -->
  <g transform="translate(20,12)">
    <rect width="22" height="14" rx="4" class="agent" /><text x="30" y="11.5" class="small">language model agent</text>
    <rect x="180" width="22" height="14" rx="2" class="node harness" /><text x="210" y="11.5" class="small">deterministic harness (no LLM)</text>
    <rect x="410" width="22" height="14" rx="2" class="node storage" /><text x="440" y="11.5" class="small">data</text>
    <rect x="490" width="22" height="14" rx="2" class="node external" /><text x="520" y="11.5" class="small">tool</text>
    <line x1="570" y1="7" x2="600" y2="7" class="edge fb" marker-end="url(#af)" /><text x="608" y="11.5" class="small">feedback round</text>
  </g>

  <!-- connectors -->
  <path d="M470 110 V134" class="edge" marker-end="url(#a)" />
  <path d="M470 216 V240" class="edge" marker-end="url(#a)" />
  <path d="M470 342 V364" class="edge" marker-end="url(#a)" />
  <path d="M470 506 V554" class="edge" marker-end="url(#a)" />
  <text x="482" y="528" class="small">no problem, or feedback</text>
  <text x="482" y="544" class="small">round already used</text>
  <path d="M232 176 H298" class="edge" marker-end="url(#a)" />
  <path d="M234 284 H298" class="edge" marker-start="url(#a)" marker-end="url(#a)" />
  <!-- feedback loop -->
  <path d="M280 436 H262 V320 H298" class="edge fb" marker-end="url(#af)" />
  <text x="252" y="372" class="fbtext" text-anchor="end">problem found:</text>
  <text x="252" y="388" class="fbtext" text-anchor="end">feedback in the</text>
  <text x="252" y="404" class="fbtext" text-anchor="end">same conversation</text>

  <!-- plan -->
  <rect x="300" y="50" width="340" height="60" rx="10" class="node input" />
  <text x="470" y="75" text-anchor="middle" class="label">Daily appliance plan</text>
  <text x="470" y="95" text-anchor="middle" class="small">cycles to run, ready times and deadlines</text>

  <!-- profiling and retrieval -->
  <rect x="300" y="136" width="340" height="80" rx="4" class="node harness" />
  <text x="318" y="156" class="tag h">HARNESS</text>
  <text x="470" y="172" text-anchor="middle" class="label">Profiling and retrieval</text>
  <text x="470" y="191" text-anchor="middle" class="small">appliance profiles from the household data</text>
  <text x="470" y="207" text-anchor="middle" class="small">+ the two most similar solved days</text>

  <!-- single agent -->
  <rect x="300" y="242" width="340" height="100" rx="14" class="agent" />
  <text x="318" y="262" class="tag">AGENT · REACT LOOP</text>
  <text x="470" y="280" text-anchor="middle" class="label">Single agent: plan and schedule</text>
  <text x="470" y="300" text-anchor="middle" class="small">reads the plan itself, no brief;</text>
  <text x="470" y="317" text-anchor="middle" class="small">plans with the Scheduler's tools</text>
  <text x="470" y="334" text-anchor="middle" class="small">thought → action (tool call) → observation</text>

  <!-- verification -->
  <path d="M470 366 L660 436 L470 506 L280 436 Z" class="node harness" />
  <text x="470" y="398" text-anchor="middle" class="tag h">HARNESS</text>
  <text x="470" y="417" text-anchor="middle" class="label">Verification</text>
  <text x="470" y="436" text-anchor="middle" class="small">missing appliance, start</text>
  <text x="470" y="452" text-anchor="middle" class="small">outside window or</text>
  <text x="470" y="468" text-anchor="middle" class="small">peak conflict?</text>

  <!-- summary -->
  <rect x="300" y="556" width="340" height="80" rx="14" class="agent" />
  <text x="470" y="584" text-anchor="middle" class="label">Single agent: finalise</text>
  <text x="470" y="605" text-anchor="middle" class="small">final schedule and</text>
  <text x="470" y="622" text-anchor="middle" class="small">summary for the household</text>

  <!-- data and tools -->
  <rect x="40" y="136" width="192" height="80" rx="4" class="node storage" />
  <text x="136" y="162" text-anchor="middle" class="label">Case library</text>
  <text x="136" y="182" text-anchor="middle" class="small">320 solved days</text>
  <text x="136" y="200" text-anchor="middle" class="small">(retrieval, RAG)</text>

  <rect x="40" y="250" width="194" height="72" rx="4" class="node external" />
  <text x="56" y="272" class="label">Tools</text>
  <text x="56" y="292" class="mono">get_spot_prices</text>
  <text x="56" y="310" class="mono">optimize_schedule (MILP)</text>

  <!-- one conversation bracket -->
  <path d="M676 242 H696 V636 H676" class="bracket" />
  <text x="712" y="420" class="conv b">One conversation</text>
  <text x="712" y="438" class="conv">plan, tool calls, feedback</text>
  <text x="712" y="456" class="conv">and summary in one history</text>
</svg>
