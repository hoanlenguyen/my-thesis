chor="middle">rooftop</text><rect x="40" y="150" width="230" height="70" rx="8" fill="#e7f1fb" stroke="#3a6ea5" stroke-width="1.5"/><text x="155" y="192" font-size="20" font-weight="600" fill="#1f2933" text-anchor="middle">Solar inverter</text><rect x="40" y="270" width="230" height="70" rx="8" fill="#fff4cc" stroke="#b08900" stroke-width="1.5"/><text x="155" y="302" font-size="20" font-weight="600" fill="#1f2933" text-anchor="middle">Wind turbine</text><text x="155" y="324" font-size="16" font-weight="400" fill="#52606d" text-anchor="middle">small, optional</text><rect x="40" y="380" width="230" height="70" rx="8" fill="#e7f1fb" stroke="#3a6ea5" stroke-width="1.5"/><text x="155" y="422" font-size="20" font-weight="600" fill="#1f2933" text-anchor="middle">Wind inverter</text><rect x="40" y="640" width="230" height="120" rx="8" fill="#e3f6e5" stroke="#2f7d3b" stroke-width="1.5"/><text x="155" y="697" font-size="20" font-weight="600" fill="#1f2933" text-anchor="middle">Home battery</text><text x="155" y="719" font-size="16" font-weight="400" fill="#52606d" text-anchor="middle">with battery inverter</text><rect x="620" y="40" width="260" height="70" rx="8" fill="#eef0f2" stroke="#6b7785" stroke-width="1.5"/><text x="750" y="82" font-size="20" font-weight="600" fill="#1f2933" text-anchor="middle">Public grid</text><rect x="620" y="150" width="260" height="100" rx="8" fill="#e7f1fb" stroke="#3a6ea5" stroke-width="1.5"/><text x="750" y="207" font-size="20" font-weight="600" fill="#1f2933" text-anchor="middle">Smart meter</text><rect x="540" y="330" width="420" height="210" rx="8" fill="#dcf5ea" stroke="#1b7f5b" stroke-width="2.5"/><text x="750" y="409" font-size="21" font-weight="600" fill="#1f2933" text-anchor="middle">Energy management controller</text><text x="750" y="432" font-size="17" font-weight="400" fill="#52606d" text-anchor="middle">= home energy gateway</text><text x="750" y="455" font-size="17" font-weight="400" fill="#52606d" text-anchor="middle">runs the HEMS: local small language model,</text><text x="750" y="477" font-size="17" font-weight="400" fill="#52606d" text-anchor="middle">MPC, checker and control layer</text><rect x="300" y="620" width="790" height="270" rx="10" fill="#fbf8ec" stroke="#a39e8a" stroke-width="1.5"/><text x="322" y="652" font-size="20" font-weight="700" fill="#1f2933" text-anchor="start">Smart loads</text><rect x="322" y="672" width="176" height="90" rx="8" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/><text x="410" y="723" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">Heat pump</text><rect x="512" y="672" width="176" height="90" rx="8" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/><text x="600" y="723" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">Water heater</text><rect x="702" y="672" width="176" height="90" rx="8" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/><text x="790" y="712" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">Air</text><text x="790" y="735" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">conditioning</text><rect x="892" y="672" width="176" height="90" rx="8" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/><text x="980" y="712" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">EV charger</text><text x="980" y="735" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">and car</text><rect x="322" y="776" width="176" height="90" rx="8" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/><text x="410" y="816" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">Washing</text><text x="410" y="839" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">machine</text><rect x="512" y="776" width="176" height="90" rx="8" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/><text x="600" y="827" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">Dishwasher</text><rect x="702" y="776" width="176" height="90" rx="8" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/><text x="790" y="816" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">Smart</text><text x="790" y="839" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">thermostats</text><rect x="892" y="776" width="176" height="90" rx="8" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/><text x="980" y="816" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">Smart</text><text x="980" y="839" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">light bulbs</text><rect x="1200" y="140" width="480" height="620" rx="10" fill="#f8f9fa" stroke="#8a94a0" stroke-width="1.3" stroke-dasharray="7 5"/><text x="1220" y="170" font-size="17" font-weight="400" fill="#52606d" text-anchor="start">In the household, over the home Wi-Fi</text><rect x="1220" y="186" width="440" height="470" rx="8" fill="#efe9ff" stroke="#5f3dc4" stroke-width="1.8"/><text x="1240" y="216" font-size="19" font-weight="700" fill="#3b2c84" text-anchor="start">Household app (phone or tablet)</text><rect x="1240" y="232" width="400" height="92" rx="8" fill="#ffffff" stroke="#8c74d6" stroke-width="1"/><text x="1440" y="263" font-size="16" font-weight="400" fill="#1f2933" text-anchor="middle">Plans, typed or spoken</text><text x="1440" y="284" font-size="16" font-weight="400" fill="#1f2933" text-anchor="middle">“car at 80 % by 07:30,</text><text x="1440" y="304" font-size="16" font-weight="400" fill="#1f2933" text-anchor="middle">guests from 18:00”</text><rect x="1240" y="336" width="400" height="68" rx="8" fill="#ffffff" stroke="#8c74d6" stroke-width="1"/><text x="1440" y="365" font-size="16" font-weight="400" fill="#1f2933" text-anchor="middle">Live view: PV, consumption, battery %,</text><text x="1440" y="386" font-size="16" font-weight="400" fill="#1f2933" text-anchor="middle">grid import/export, EV, indoor °C</text><rect x="1240" y="416" width="400" height="68" rx="8" fill="#ffffff" stroke="#8c74d6" stroke-width="1"/><text x="1440" y="445" font-size="16" font-weight="400" fill="#1f2933" text-anchor="middle">Today’s plan, prices and the</text><text x="1440" y="466" font-size="16" font-weight="400" fill="#1f2933" text-anchor="middle">committed requirements</text><rect x="1240" y="496" width="400" height="50" rx="8" fill="#ffffff" stroke="#8c74d6" stroke-width="1"/><text x="1440" y="527" font-size="16" font-weight="400" fill="#1f2933" text-anchor="middle">Savings vs rules, PV used at home</text><rect x="1240" y="558" width="400" height="68" rx="8" fill="#ffffff" stroke="#8c74d6" stroke-width="1"/><text x="1440" y="587" font-size="16" font-weight="400" fill="#1f2933" text-anchor="middle">Questions and messages,</text><text x="1440" y="608" font-size="16" font-weight="400" fill="#1f2933" text-anchor="middle">each with its reason</text><rect x="1220" y="672" width="440" height="72" rx="8" fill="#ffffff" stroke="#8c74d6" stroke-width="1.2"/><text x="1440" y="704" font-size="17" font-weight="600" fill="#1f2933" text-anchor="middle">Voice satellite (optional)</text><text x="1440" y="724" font-size="15" font-weight="400" fill="#52606d" text-anchor="middle">wake word; speech becomes text on the gateway</text><rect x="1200" y="790" width="480" height="110" rx="8" fill="#ffe8cc" stroke="#c2610c" stroke-width="1.5"/><text x="1440" y="830" font-size="20" font-weight="600" fill="#1f2933" text-anchor="middle">Internet services</text><text x="1440" y="853" font-size="17" font-weight="400" fill="#52606d" text-anchor="middle">day-ahead prices · weather forecasts</text><text x="1440" y="875" font-size="17" font-weight="400" fill="#52606d" text-anchor="middle">cloud LLM (optional fallback)</text><text x="832" y="295" font-size="16" font-weight="400" fill="#c92a2a" text-anchor="start">meter data</text><text x="300" y="508" font-size="16" font-weight="400" fill="#c92a2a" text-anchor="start">battery setpoints</text><text x="832" y="585" font-size="16" font-weight="400" fill="#c92a2a" text-anchor="start">device setpoints</text><text x="1080" y="390" font-size="16" font-weight="400" fill="#c92a2a" text-anchor="middle">Wi-Fi, encrypted</text><text x="975" y="492" font-size="16" font-weight="400" fill="#c92a2a" text-anchor="start">prices, forecasts, fallback</text><text x="114" y="971" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start">communication</text><text x="404" y="971" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start">DC power</text><text x="694" y="971" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start">AC power</text><text x="984" y="971" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start">two-way power flow</text></svg>