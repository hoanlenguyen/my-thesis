<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 1010" width="1420" height="1010" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="A home energy system: solar PV, a small wind turbine and the home battery share one hybrid inverter; the inverter, the smart loads and the smart meter to the public grid meet at the distribution board, the home AC bus. No power passes through the energy management controller (the home energy gateway): it reads the meter and inverters, sets the battery and the smart loads, talks to the household app over the home Wi-Fi and gets prices and forecasts from the internet."><defs><marker id="dc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="two" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7285"/></marker><marker id="com" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect width="1420" height="1010" fill="#ffffff"/><path d="M92,130 L92,198" fill="none" stroke="#2f9e44" stroke-width="2.2" marker-end="url(#dc)"/><path d="M227,130 L227,198" fill="none" stroke="#2f9e44" stroke-width="2.2" marker-end="url(#dc)"/><path d="M160,428 L160,282" fill="none" stroke="#2f9e44" stroke-width="2.2" marker-start="url(#dc)" marker-end="url(#dc)"/><path d="M290,240 L338,240" fill="none" stroke="#1971c2" stroke-width="2.2" marker-start="url(#ac)" marker-end="url(#ac)"/><path d="M412,200 L618,200" fill="none" stroke="#1971c2" stroke-width="2.2" marker-start="url(#ac)" marker-end="url(#ac)"/><path d="M750,110 L750,148" fill="none" stroke="#1971c2" stroke-width="2.2" marker-start="url(#ac)" marker-end="url(#ac)"/><path d="M375,570 L375,618" fill="none" stroke="#1971c2" stroke-width="2.2" marker-end="url(#ac)"/><path d="M820,250 L820,328" fill="none" stroke="#c92a2a" stroke-width="2.2" stroke-dasharray="7 5" marker-start="url(#com)" marker-end="url(#com)"/><path d="M30,240 L12,240 L12,595 L660,595 L660,542" fill="none" stroke="#c92a2a" stroke-width="2.2" stroke-dasharray="7 5" marker-start="url(#com)" marker-end="url(#com)"/><path d="M820,540 L820,618" fill="none" stroke="#c92a2a" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#com)"/><path d="M960,390 L1118,390" fill="none" stroke="#c92a2a" stroke-width="2.2" stroke-dasharray="7 5" marker-start="url(#com)" marker-end="url(#com)"/><path d="M1118,510 L962,510" fill="none" stroke="#c92a2a" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#com)"/><path d="M40,965 L100,965" fill="none" stroke="#c92a2a" stroke-width="2.2" stroke-dasharray="7 5" marker-start="url(#com)" marker-end="url(#com)"/><path d="M330,965 L390,965" fill="none" stroke="#2f9e44" stroke-width="2.2" marker-end="url(#dc)"/><path d="M620,965 L680,965" fill="none" stroke="#1971c2" stroke-width="2.2" marker-end="url(#ac)"/><path d="M910,965 L970,965" fill="none" stroke="#1971c2" stroke-width="2.2" marker-start="url(#ac)" marker-end="url(#ac)"/><rect x="30" y="40" width="125" height="90" rx="8" fill="#fff4cc" stroke="#b08900" stroke-width="1.5"/><text x="92" y="82" font-size="18" font-weight="600" fill="#1f2933" text-anchor="middle">Solar PV</text><text x="92" y="102" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">rooftop</text><rect x="165" y="40" width="125" height="90" rx="8" fill="#fff4cc" stroke="#b08900" stroke-width="1.5"/><text x="228" y="73" font-size="18" font-weight="600" fill="#1f2933" text-anchor="middle">Wind turbine</text><text x="228" y="92" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">small, optional</text><text x="228" y="111" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">with rectifier</text><rect x="30" y="200" width="260" height="80" rx="8" fill="#e7f1fb" stroke="#3a6ea5" stroke-width="1.5"/><text x="160" y="237" font-size="20" font-weight="600" fill="#1f2933" text-anchor="middle">Hybrid inverter</text><text x="160" y="259" font-size="16" font-weight="400" fill="#52606d" text-anchor="middle">DC inputs: solar, wind, battery</text><rect x="30" y="430" width="260" height="90" rx="8" fill="#e3f6e5" stroke="#2f7d3b" stroke-width="1.5"/><text x="160" y="482" font-size="20" font-weight="600" fill="#1f2933" text-anchor="middle">Home battery</text><rect x="340" y="150" width="70" height="420" rx="8" fill="#eef0f2" stroke="#6b7785" stroke-width="1.5"/><text transform="translate(368,360) rotate(-90)" font-size="19" font-weight="600" fill="#1f2933" text-anchor="middle">Distribution board</text><text transform="translate(392,360) rotate(-90)" font-size="16" font-weight="400" fill="#52606d" text-anchor="middle">the home’s AC bus</text><rect x="620" y="40" width="260" height="70" rx="8" fill="#eef0f2" stroke="#6b7785" stroke-width="1.5"/><text x="750" y="82" font-size="20" font-weight="600" fill="#1f2933" text-anchor="middle">Public grid</text><rect x="620" y="150" width="260" height="100" rx="8" fill="#e7f1fb" stroke="#3a6ea5" stroke-width="1.5"/><text x="750" y="207" font-size="20" font-weight="600" fill="#1f2933" text-anchor="middle">Smart meter</text><rect x="540" y="330" width="420" height="210" rx="8" fill="#dcf5ea" stroke="#1b7f5b" stroke-width="2.5"/><text x="750" y="431" font-size="21" font-weight="600" fill="#1f2933" text-anchor="middle">Energy management controller</text><text x="750" y="455" font-size="17" font-weight="400" fill="#52606d" text-anchor="middle">(home energy gateway)</text><rect x="300" y="620" width="790" height="270" rx="10" fill="#fbf8ec" stroke="#a39e8a" stroke-width="1.5"/><text x="322" y="652" font-size="20" font-weight="700" fill="#1f2933" text-anchor="start">Smart loads</text><rect x="322" y="672" width="176" height="90" rx="8" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/><text x="410" y="723" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">Heat pump</text><rect x="512" y="672" width="176" height="90" rx="8" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/><text x="600" y="723" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">Water heater</text><rect x="702" y="672" width="176" height="90" rx="8" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/><text x="790" y="712" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">Air</text><text x="790" y="735" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">conditioning</text><rect x="892" y="672" width="176" height="90" rx="8" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/><text x="980" y="712" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">EV charger</text><text x="980" y="735" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">and car</text><rect x="322" y="776" width="176" height="90" rx="8" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/><text x="410" y="816" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">Washing</text><text x="410" y="839" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">machine</text><rect x="512" y="776" width="176" height="90" rx="8" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/><text x="600" y="827" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">Dishwasher</text><rect x="702" y="776" width="176" height="90" rx="8" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/><text x="790" y="816" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">Smart</text><text x="790" y="839" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">thermostats</text><rect x="892" y="776" width="176" height="90" rx="8" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/><text x="980" y="816" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">Smart</text><text x="980" y="839" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">light bulbs</text><rect x="1120" y="345" width="270" height="90" rx="8" fill="#efe9ff" stroke="#5f3dc4" stroke-width="1.5"/><text x="1255" y="387" font-size="20" font-weight="600" fill="#1f2933" text-anchor="middle">Household app</text><text x="1255" y="409" font-size="16" font-weight="400" fill="#52606d" text-anchor="middle">phone or tablet</text><rect x="1120" y="465" width="270" height="90" rx="8" fill="#ffe8cc" stroke="#c2610c" stroke-width="1.5"/><text x="1255" y="507" font-size="20" font-weight="600" fill="#1f2933" text-anchor="middle">Internet services</text><text x="1255" y="529" font-size="16" font-weight="400" fill="#52606d" text-anchor="middle">day-ahead prices, weather forecasts</text><text x="832" y="295" font-size="16" font-weight="400" fill="#c92a2a" text-anchor="start">meter data</text><text x="395" y="587" font-size="16" font-weight="400" fill="#c92a2a" text-anchor="start">inverter data, battery setpoints</text><text x="832" y="585" font-size="16" font-weight="400" fill="#c92a2a" text-anchor="start">device setpoints</text><text x="1040" y="380" font-size="16" font-weight="400" fill="#c92a2a" text-anchor="middle">home Wi-Fi</text><text x="1040" y="500" font-size="16" font-weight="400" fill="#c92a2a" text-anchor="middle">prices, forecasts</text><text x="114" y="971" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start">communication</text><text x="404" y="971" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start">DC power</text><text x="694" y="971" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start">AC power</text><text x="984" y="971" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start">two arrowheads: power flows both ways</text></svg>