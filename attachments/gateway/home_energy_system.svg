<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 1010" width="1720" height="1010" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="A home energy system: solar PV and a small wind turbine feed inverters, the inverters and the grid meet at the smart meter, and the energy management controller (the home energy gateway) reads the meter and inverters, sets the battery and the smart loads, talks to the household app over the home Wi-Fi and gets prices and forecasts from the internet."><defs><marker id="dc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="two" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7285"/></marker><marker id="com" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect width="1720" height="1010" fill="#ffffff"/><path d="M155,110 L155,148" fill="none" stroke="#2f9e44" stroke-width="2.2" marker-end="url(#dc)"/><path d="M155,340 L155,378" fill="none" stroke="#2f9e44" stroke-width="2.2" marker-end="url(#dc)"/><path d="M270,185 L618,185" fill="none" stroke="#d9480f" stroke-width="2.2" marker-end="url(#ac)"/><path d="M270,400 L460,400 L460,225 L618,225" fill="none" stroke="#d9480f" stroke-width="2.2" marker-end="url(#ac)"/><path d="M750,110 L750,148" fill="none" stroke="#0b7285" stroke-width="2.2" marker-start="url(#two)" marker-end="url(#two)"/><path d="M700,250 L700,328" fill="none" stroke="#0b7285" stroke-width="2.2" marker-start="url(#two)" marker-end="url(#two)"/><path d="M700,540 L700,618" fill="none" stroke="#0b7285" stroke-width=