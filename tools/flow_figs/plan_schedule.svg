<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 686" role="img">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-amber"><rect x="150" y="20" width="300" height="44" rx="8" stroke-width="0.8"/><text class="th" x="300" y="42" text-anchor="middle" dominant-baseline="central">Requirements from the model</text></g>
<line x1="300" y1="64" x2="300" y2="92" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="150" y="94" width="300" height="56" rx="8" stroke-width="0.8"/><text class="th" x="300" y="112" text-anchor="middle" dominant-baseline="central">1. Complete with rules in code</text><text class="ts" x="300" y="132" text-anchor="middle" dominant-baseline="central">usual car settings, deadlines, am/pm</text></g>
<line x1="300" y1="150" x2="300" y2="178" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="150" y="180" width="300" height="56" rx="8" stroke-width="0.8"/><text class="th" x="300" y="198" text-anchor="middle" dominant-baseline="central">2. Read back in words</text><text class="ts" x="300" y="218" text-anchor="middle" dominant-baseline="central">weekday, part of day, hours from now</text></g>
<line x1="300" y1="236" x2="300" y2="264" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="150" y="266" width="300" height="56" rx="8" stroke-width="0.8"/><text class="th" x="300" y="284" text-anchor="middle" dominant-baseline="central">3. Checker</text><text class="ts" x="300" y="304" text-anchor="middle" dominant-baseline="central">vague word, conflict, short window</text></g>
<line x1="450" y1="294" x2="478" y2="294" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="480" y="266" width="170" height="56" rx="8" stroke-width="0.8"/><text class="th" x="565" y="284" text-anchor="middle" dominant-baseline="central">Problems returned</text><text class="ts" x="565" y="304" text-anchor="middle" dominant-baseline="central">model asks household</text></g>
<text class="ts" x="310" y="337" dominant-baseline="central">no problems</text>
<line x1="300" y1="322" x2="300" y2="350" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="150" y="352" width="300" height="56" rx="8" stroke-width="0.8"/><text class="th" x="300" y="370" text-anchor="middle" dominant-baseline="central">4. EMHASS solves once</text><text class="ts" x="300" y="390" text-anchor="middle" dominant-baseline="central">a preview on today's forecasts</text></g>
<line x1="300" y1="408" x2="300" y2="436" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="150" y="438" width="300" height="56" rx="8" stroke-width="0.8"/><text class="th" x="300" y="456" text-anchor="middle" dominant-baseline="central">5. Result for the app</text><text class="ts" x="300" y="476" text-anchor="middle" dominant-baseline="central">schedule, reasons, cost, saving, checks</text></g>
<line x1="300" y1="494" x2="300" y2="522" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="150" y="524" width="300" height="56" rx="8" stroke-width="0.8"/><text class="th" x="300" y="542" text-anchor="middle" dominant-baseline="central">Model compares read-back</text><text class="ts" x="300" y="562" text-anchor="middle" dominant-baseline="central">with the household's message</text></g>
<line x1="450" y1="552" x2="478" y2="552" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="480" y="524" width="170" height="56" rx="8" stroke-width="0.8"/><text class="th" x="565" y="542" text-anchor="middle" dominant-baseline="central">Wrong time</text><text class="ts" x="565" y="562" text-anchor="middle" dominant-baseline="central">calls again from step 1</text></g>
<text class="ts" x="310" y="595" dominant-baseline="central">matches</text>
<line x1="300" y1="580" x2="300" y2="608" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="150" y="610" width="300" height="56" rx="8" stroke-width="0.8"/><text class="th" x="300" y="628" text-anchor="middle" dominant-baseline="central">Gateway commits</text><text class="ts" x="300" y="648" text-anchor="middle" dominant-baseline="central">only if every requirement met or warned</text></g>
</svg>
