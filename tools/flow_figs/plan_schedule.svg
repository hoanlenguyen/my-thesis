<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 990" role="img">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-amber"><rect x="40" y="20" width="340" height="56" rx="4" stroke-width="0.8" style="stroke-dasharray:5 3"/><text class="th" x="210" y="38" text-anchor="middle" dominant-baseline="central">Model calls plan_schedule</text><text class="ts" x="210" y="58" text-anchor="middle" dominant-baseline="central">requirements read from the message</text></g>
<line x1="380" y1="48" x2="408" y2="48" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="410" y="20" width="230" height="56" rx="4" stroke-width="0.8"/><text class="th" x="525" y="38" text-anchor="middle" dominant-baseline="central">Set-up without checks</text><text class="ts" x="525" y="58" text-anchor="middle" dominant-baseline="central">usual car settings only</text></g>
<path d="M600 76 L600 440 L382 440" class="arr" style="stroke-dasharray:2 3" marker-end="url(#arrow)"/>
<line x1="210" y1="76" x2="210" y2="98" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="100" width="340" height="92" rx="4" stroke-width="0.8"/><text class="th" x="210" y="120" text-anchor="middle" dominant-baseline="central">1. Complete with rules in code</text><text class="ts" x="210" y="142" text-anchor="middle" dominant-baseline="central">usual car target and ready-by time</text><text class="ts" x="210" y="158" text-anchor="middle" dominant-baseline="central">no deadline: end of the known prices</text><text class="ts" x="210" y="174" text-anchor="middle" dominant-baseline="central">time without am/pm: next occurrence</text></g>
<line x1="210" y1="192" x2="210" y2="214" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="216" width="340" height="56" rx="4" stroke-width="0.8"/><text class="th" x="210" y="234" text-anchor="middle" dominant-baseline="central">2. Read back in words</text><text class="ts" x="210" y="254" text-anchor="middle" dominant-baseline="central">weekday, part of day, hours from now</text></g>
<line x1="210" y1="272" x2="210" y2="294" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="296" width="340" height="92" rx="4" stroke-width="0.8"/><text class="th" x="210" y="316" text-anchor="middle" dominant-baseline="central">3. Checker</text><text class="ts" x="210" y="338" text-anchor="middle" dominant-baseline="central">vague words or an empty request</text><text class="ts" x="210" y="354" text-anchor="middle" dominant-baseline="central">time passed or window too short</text><text class="ts" x="210" y="370" text-anchor="middle" dominant-baseline="central">conflict or missing temperature</text></g>
<line x1="380" y1="342" x2="408" y2="342" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="410" y="314" width="170" height="56" rx="20" stroke-width="0.8"/><text class="th" x="495" y="332" text-anchor="middle" dominant-baseline="central">Not planned</text><text class="ts" x="495" y="352" text-anchor="middle" dominant-baseline="central">the model asks</text></g>
<line x1="210" y1="388" x2="210" y2="410" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="40" y="412" width="340" height="56" rx="4" stroke-width="2"/><text class="th" x="210" y="430" text-anchor="middle" dominant-baseline="central">4. MPC solves once (EMHASS)</text><text class="ts" x="210" y="450" text-anchor="middle" dominant-baseline="central">car, appliances, heat pump, battery</text></g>
<line x1="210" y1="468" x2="210" y2="490" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="492" width="340" height="74" rx="4" stroke-width="0.8"/><text class="th" x="210" y="512" text-anchor="middle" dominant-baseline="central">5. Check each requirement</text><text class="ts" x="210" y="534" text-anchor="middle" dominant-baseline="central">car charged by ready-by, or a warning</text><text class="ts" x="210" y="550" text-anchor="middle" dominant-baseline="central">runs in their windows, temperature in band</text></g>
<line x1="210" y1="566" x2="210" y2="588" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="590" width="340" height="92" rx="4" stroke-width="0.8"/><text class="th" x="210" y="610" text-anchor="middle" dominant-baseline="central">6. Result for the model and the app</text><text class="ts" x="210" y="632" text-anchor="middle" dominant-baseline="central">times and a reason for each device</text><text class="ts" x="210" y="648" text-anchor="middle" dominant-baseline="central">cost, saving against starting now, warnings</text><text class="ts" x="210" y="664" text-anchor="middle" dominant-baseline="central">hourly timeline of prices and devices</text></g>
<line x1="210" y1="682" x2="210" y2="704" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="40" y="706" width="340" height="56" rx="4" stroke-width="0.8" style="stroke-dasharray:5 3"/><text class="th" x="210" y="724" text-anchor="middle" dominant-baseline="central">Model compares the read-back</text><text class="ts" x="210" y="744" text-anchor="middle" dominant-baseline="central">with the message; commit or ask</text></g>
<line x1="380" y1="734" x2="408" y2="734" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="410" y="706" width="170" height="56" rx="20" stroke-width="0.8"/><text class="th" x="495" y="724" text-anchor="middle" dominant-baseline="central">Wrong reading</text><text class="ts" x="495" y="744" text-anchor="middle" dominant-baseline="central">calls again, step 1</text></g>
<line x1="210" y1="762" x2="210" y2="784" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="786" width="340" height="74" rx="4" stroke-width="0.8"/><text class="th" x="210" y="806" text-anchor="middle" dominant-baseline="central">7. Gateway commit gate</text><text class="ts" x="210" y="828" text-anchor="middle" dominant-baseline="central">model commits, no problems, every</text><text class="ts" x="210" y="844" text-anchor="middle" dominant-baseline="central">requirement met or warned</text></g>
<line x1="380" y1="823" x2="408" y2="823" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="410" y="795" width="170" height="56" rx="20" stroke-width="0.8"/><text class="th" x="495" y="813" text-anchor="middle" dominant-baseline="central">Otherwise</text><text class="ts" x="495" y="833" text-anchor="middle" dominant-baseline="central">the household is asked</text></g>
<line x1="210" y1="860" x2="210" y2="882" class="arr" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="40" y="884" width="340" height="56" rx="20" stroke-width="0.8"/><text class="th" x="210" y="902" text-anchor="middle" dominant-baseline="central">Committed</text><text class="ts" x="210" y="922" text-anchor="middle" dominant-baseline="central">the app shows the plan; MPC replans hourly</text></g>
<g class="c-amber"><rect x="40" y="964" width="26" height="14" rx="3" stroke-width="0.8" style="stroke-dasharray:5 3"/></g><text class="ts" x="72" y="971" dominant-baseline="central">model</text>
<g class="c-teal"><rect x="122" y="964" width="26" height="14" rx="3" stroke-width="0.8"/></g><text class="ts" x="154" y="971" dominant-baseline="central">harness code</text>
<g class="c-blue"><rect x="246" y="964" width="26" height="14" rx="3" stroke-width="2"/></g><text class="ts" x="278" y="971" dominant-baseline="central">optimiser</text>
<g class="c-coral"><rect x="350" y="964" width="26" height="14" rx="7" stroke-width="0.8"/></g><text class="ts" x="382" y="971" dominant-baseline="central">ask</text>
<g class="c-green"><rect x="418" y="964" width="26" height="14" rx="7" stroke-width="0.8"/></g><text class="ts" x="450" y="971" dominant-baseline="central">commit</text>
<line x1="510" y1="971" x2="536" y2="971" class="arr" style="stroke-dasharray:2 3"/><text class="ts" x="542" y="971" dominant-baseline="central">without checks</text>
</svg>
