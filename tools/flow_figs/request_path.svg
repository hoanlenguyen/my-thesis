<g class="c-gray"><rect x="40" y="20" width="120" height="56" rx="8" stroke-width="0.8"/><text class="th" x="100" y="40" text-anchor="middle" dominant-baseline="central">Household</text><text class="ts" x="100" y="58" text-anchor="middle" dominant-baseline="central">app</text></g>
